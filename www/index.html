<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08783f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tutor SmartMatch">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Tutor SmartMatch</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc}
    #app{height:100%;display:flex;flex-direction:column}.top{height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#006b3c,#4fbf27);color:#fff;flex:none;padding-top:env(safe-area-inset-top)}
    .brand{font-weight:800;flex:1;letter-spacing:.2px}.btn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
    .frame{position:relative;flex:1;background:#fff}.frame iframe{width:100%;height:100%;border:0;display:block}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:2;color:#08783f;font-weight:600}.loading.hidden{display:none}
    .error{display:none;position:absolute;inset:0;padding:40px 24px;text-align:center;background:#fff;z-index:3}.error.show{display:block}
    .error button{margin-top:16px;border:0;border-radius:10px;padding:11px 18px;background:#08783f;color:#fff}
  </style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="btn" id="back" aria-label="返回">‹</button>
    <div class="brand">Tutor SmartMatch</div>
    <button class="btn" id="refresh">刷新</button>
  </div>
  <div class="frame">
    <div class="loading" id="loading">正在打开 Tutor SmartMatch…</div>
    <div class="error" id="error">
      <h3>暂时无法连接</h3>
      <p>请检查网络后重试。</p>
      <button id="retry">重新连接</button>
    </div>
    <iframe id="site" title="Tutor SmartMatch"></iframe>
  </div>
</div>
<script>
const TARGET="https://aplusachiever2025-create.github.io/app/";
let lastHistoryUrl = TARGET;

const frame=document.getElementById("site"),loading=document.getElementById("loading"),error=document.getElementById("error");
function openSite(){
  loading.classList.remove("hidden"); error.classList.remove("show");
  frame.src=TARGET + "?app_shell=1";
}
frame.addEventListener("load",()=>loading.classList.add("hidden"));
frame.addEventListener("error",()=>{loading.classList.add("hidden");error.classList.add("show")});
document.getElementById("refresh").onclick=()=>openSite();
document.getElementById("back").onclick=()=>{
  try {
    if (frame.contentWindow && frame.contentWindow.history.length > 1) frame.contentWindow.history.back();
    else window.history.back();
  } catch(e) { window.history.back(); }
};
document.getElementById("retry").onclick=openSite;
document.addEventListener("backbutton",()=>{ history.back(); });
window.addEventListener("popstate",()=>{ if(location.href===location.origin+"/") openSite(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) frame.contentWindow?.postMessage({type:"smartmatch_resume"},"*"); });
openSite();

</script>
</body>
</html>
